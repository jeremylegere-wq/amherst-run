name: CI

# Runs on every pull request and on pushes to main. The release workflow reuses it (workflow_call),
# so a tag can never publish a build that did not pass the same checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  schedule:
    # Weekly, with no code change: catches breakage from outside (new runner images, new pygame/numpy releases).
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # pygame runs without a window or sound card on the CI machines.
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.deps == 'batocera' && ', Batocera versions' || '' }}${{ matrix.experimental && ', allowed to fail' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # A job marked experimental shows its result but cannot fail the run (a known gap we are watching).
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the main target (Batocera, Pydroid); Windows and macOS cover the desktop quick start.
          # Batocera parity: its Python 3.11 with the OLDEST versions requirements.txt allows (pygame 2.5.2 is what
          # Batocera ships). The other jobs install the newest releases, so together they cover both ends.
          - { os: ubuntu-latest, python: "3.11", deps: batocera }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
          # Known gap: pygame 2.6.1 (newest on PyPI) has no Python 3.14 wheels, so pip has to build it from
          # source. Kept visible until pygame ships 3.14 wheels; then drop "experimental".
          - { os: ubuntu-latest, python: "3.14", experimental: true }
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (newest allowed)
        if: matrix.deps != 'batocera'
        run: python -m pip install -r requirements.txt

      - name: Install dependencies (Batocera versions - the minimums in requirements.txt)
        if: matrix.deps == 'batocera'
        run: python -m pip install "pygame==2.5.2" "numpy==1.24.4"

      - name: Show the versions under test
        run: python -c "import sys, pygame, numpy; print(sys.version); print('pygame', pygame.version.ver, 'numpy', numpy.__version__)"

      # Byte-compiles every file, including tools the tests never import, so syntax newer than this Python
      # (e.g. 3.12-only f-strings on Batocera's 3.11) fails here instead of on someone's machine.
      - name: Compile every Python file
        run: python -m compileall -q -x "[/\\]\.venv" game tools tests update_map.py play_android.py

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test - drive for 120 frames on the bundled Amherst map
        run: python -m game.main --frames 120 --autodrive

      - name: Smoke test - drive for 120 frames on the generated sample town (retro style)
        run: python -m game.main --map data/sample_map.json --style retro --frames 120 --autodrive

      - name: Smoke test - touch controls and input debug overlay
        run: python -m game.main --touch --debug-input --no-joy --frames 60 --autodrive

  lint:
    name: Lint (ruff, correctness rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff==0.16.9

      # Only rules that find real bugs (syntax errors, undefined names, broken comparisons).
      # Style rules are not enforced because the project has no existing style config.
      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 --output-format=github .

  package:
    name: Release zip builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build the release zip
        run: |
          version="$(python -c 'from game import __version__; print(__version__)')"
          tools/build_release_zip.sh "$version" dist
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check the zip contents
        run: |
          unzip -l "dist/amherst-run-v${VERSION}.zip"
          unzip -Z1 "dist/amherst-run-v${VERSION}.zip" > dist/files.txt
          for needed in game/main.py data/amherst_map.json play_android.py AmherstRun.sh README.md CHANGELOG.md; do
            grep -q "^amherst-run-v${VERSION}/${needed}$" dist/files.txt || { echo "::error::zip is missing ${needed}"; exit 1; }
          done
          if grep -E "/(\.github|CLAUDE\.md)" dist/files.txt; then
            echo "::error::zip contains files that should be export-ignored"; exit 1
          fi

      - name: Run the game from the unpacked zip
        run: |
          mkdir unpacked
          unzip -q "dist/amherst-run-v${VERSION}.zip" -d unpacked
          cd "unpacked/amherst-run-v${VERSION}"
          python -m game.main --version
          python -m game.main --frames 120 --autodrive
