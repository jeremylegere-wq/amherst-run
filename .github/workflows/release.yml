name: Release

# Starts when a version tag such as v0.1.0 (or v0.2.0-rc.1) is pushed. It re-runs every CI check, then
# creates a DRAFT GitHub Release with the game zip, the native game's baked map and golden files, and checksums. Nothing is published
# anywhere else. You review the draft and press "Publish release" yourself.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Create draft GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # the only job that can write; used to create the release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Tag $TAG is not on the main branch. Merge to main first, then tag."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check tag, game version and CHANGELOG agree, and extract the release notes
        run: python tools/release_notes.py "$TAG" > release-notes.md

      - name: Build the release zip and checksums
        run: tools/build_release_zip.sh "$TAG" dist

      - name: Bake the map and golden files for the native C++ game (amherst-run-native)
        env:
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          python -m pip install --quiet -r requirements.txt
          python tools/bake_native.py --out dist/amherst.amr
          python tools/golden.py --out dist/golden
          (cd dist && python -m zipfile -c golden.zip golden/ && sha256sum amherst.amr golden.zip >> SHA256SUMS.txt)

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/amherst-run-*.zip dist/amherst.amr dist/golden.zip dist/SHA256SUMS.txt \
            --draft --verify-tag $flags \
            --title "Amherst Run ${TAG}" \
            --notes-file release-notes.md
