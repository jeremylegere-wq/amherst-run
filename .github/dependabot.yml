version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions up to date; each bump arrives as a reviewable pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements.txt holds MINIMUM versions, kept low on purpose: Batocera ships pygame 2.5.2 with Python 3.11,
    # and older numpy. Raising them would stop the game installing there, so Dependabot must not bump them.
    ignore:
      - dependency-name: pygame
      - dependency-name: numpy
